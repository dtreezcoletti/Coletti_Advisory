services:
  # Canonical production application surface.
  # All public, authentication, client, staff, and owner/admin UI is served
  # from this one static application. Supabase is the backend authority.
  - type: web
    runtime: static
    name: coletti-co-demo
    buildCommand: echo "Coletti & Co. single-platform static app requires no build"
    staticPublishPath: ./web
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /reset-password
        destination: /reset-password/index.html
      - type: rewrite
        source: /reset-password/
        destination: /reset-password/index.html
      - type: rewrite
        source: /recovery
        destination: /recovery/index.html
      - type: rewrite
        source: /recovery/
        destination: /recovery/index.html
      - type: rewrite
        source: /login
        destination: /login/index.html
      - type: rewrite
        source: /workspace
        destination: /workspace/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
