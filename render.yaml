services:
  - type: web
    runtime: static
    name: coletti-co
    buildCommand: echo "Coletti & Co. static site requires no build"
    staticPublishPath: ./web
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600

  - type: web
    runtime: python
    name: coletti-co-demo
    plan: free
    buildCommand: pip install -e .
    startCommand: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_MODE
        value: demo
