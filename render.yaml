services:
  - type: web
    runtime: static
    name: coletti-co-demo
    buildCommand: echo "Coletti & Co. static site requires no build"
    staticPublishPath: ./web
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /reset-password
        destination: /reset-password/index.html
      - type: rewrite
        source: /reset-password/
        destination: /reset-password/index.html
      - type: rewrite
        source: /recovery
        destination: /recovery/index.html
      - type: rewrite
        source: /recovery/
        destination: /recovery/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600

  - type: web
    runtime: python
    name: coletti-co
    plan: free
    buildCommand: pip install -e .
    startCommand: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_MODE
        value: production
      - key: STORAGE_BACKEND
        value: supabase
      - key: COLETTIOS_BACKEND
        value: http
      - key: SUPABASE_URL
        value: https://lepdppbygnevzcquvmtt.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: client-documents
      - key: STORAGE_KEY_VERSION
        value: v1
      - key: COLETTIOS_API_URL
        value: https://colettios-core.onrender.com
      - key: SESSION_TTL_MINUTES
        value: "480"
