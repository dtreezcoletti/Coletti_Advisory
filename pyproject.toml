[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coletti-advisory"
version = "0.2.0"
description = "Coletti & Co. commercial interface for ColettiOS"
requires-python = ">=3.11"
dependencies = [
  "streamlit[auth]>=1.62,<2",
  "cryptography>=43,<47",
  "requests>=2.32,<3",
  "google-cloud-storage>=2.18,<4",
  "google-auth>=2.35,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
