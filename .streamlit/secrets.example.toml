# Copy these values into Streamlit Community Cloud -> App settings -> Secrets.
# Never commit a real secrets.toml file or any real credential value.

APP_MODE = "demo" # change to production only after the production gate passes
AUTH_PROVIDER = "google"
SESSION_TTL_MINUTES = "480" # production preflight permits 5-1440
COLETTIOS_BACKEND = "synthetic" # production: http
STORAGE_BACKEND = "local_demo" # production: gcs

# Split-Plane Security v2 root secret. URL-safe base64 encoding of exactly
# 32 random bytes. The root secret is not used directly as a source-object AES key;
# scoped data keys are derived with HKDF-SHA256. Never reuse demo/test keys.
# The initial release hard-pins cryptographic profile/key version v1 in code;
# rotation to a future profile requires a tested migration rather than a secret flip.
STORAGE_MASTER_KEY = "BASE64_URLSAFE_32_BYTE_KEY"

# Application authorization is separate from OIDC identity. Production requires
# at least one enabled account with organization_id, role, and engagement_ids.
# `eng-coletti-co-live` is the permanent Coletti & Co. Live workspace. Additional
# client engagements should receive their own distinct IDs rather than sharing it.
# Set enabled=false to revoke an authenticated account without changing code.
AUTHZ_REGISTRY_JSON = '''{"owner@example.com":{"display_name":"Owner","organization_id":"org-coletti","role":"owner","engagement_ids":["eng-coletti-co-live"],"enabled":true}}'''

# Production ColettiOS service. HTTPS is mandatory.
COLETTIOS_API_URL = "https://core.example.com"
COLETTIOS_API_TOKEN = "REPLACE_WITH_STRONG_SERVER_TO_SERVER_SECRET"

# Production encrypted Google Cloud Storage.
GCS_BUCKET = "REPLACE_WITH_PRIVATE_BUCKET_NAME"
# Production preflight requires project_id, client_email, and private_key fields.
GCP_SERVICE_ACCOUNT_JSON = '''{"type":"service_account","project_id":"REPLACE_ME","client_email":"REPLACE_ME","private_key":"REPLACE_ME"}'''

# Streamlit OIDC configuration. The production app also fails closed when the
# [auth] configuration is absent because no authenticated principal can exist.
[auth]
redirect_uri = "https://coletti2.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_LONG_RANDOM_SECRET"

[auth.google]
client_id = "REPLACE_ME"
client_secret = "REPLACE_ME"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
