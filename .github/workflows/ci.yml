name: security-and-tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m compileall -q coletti_advisory streamlit_app.py
      - run: pytest -q
      - name: Check operational web JavaScript syntax
        run: |
          node --check web/assets/app.js
          node --check web/assets/config.js
          node --check web/assets/registry_lookup.js
          node --check web/assets/portal_routing_v1.js
          node --check web/assets/portal_lifecycle_v1.js
          node --check web/assets/public_language_v1.js
          node --check web/assets/record_state_runtime_v1.js
          node --check web/assets/access_entry_v1.js
          node --check web/assets/owner_governance_v1.js
      - name: Prevent privileged Supabase keys in browser source
        run: |
          if grep -R -E "sb_secret_[A-Za-z0-9_-]{10,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=" web/ --include='*.js' --include='*.html'; then
            echo "Privileged Supabase credential pattern found in browser source"
            exit 1
          fi
