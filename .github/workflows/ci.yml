name: security-and-tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m compileall -q coletti_advisory streamlit_app.py
      - run: pytest -q
      - name: Check operational web JavaScript syntax
        run: node --check web/assets/app.js && node --check web/assets/config.js
      - name: Prevent privileged Supabase keys in browser source
        run: |
          if grep -R -E "service_role|sb_secret_" web/; then
            echo "Privileged Supabase credential marker found in web source"
            exit 1
          fi
