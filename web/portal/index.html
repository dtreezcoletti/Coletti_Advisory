<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f4efe7" />
  <title>Coletti & Co. Client Portal</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/assets/portal_integration_v2.css" />
  <script>
    window.COLETTI_ENTRY_SURFACE = 'client';
    if (!location.hash) location.hash = '#/sign-in';
    const sanitizeClientBranding = () => {
      if (!document.body) return;
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        const current = node.nodeValue || '';
        const next = current
          .replace(/ColettiOS Source ID/g, 'controlled Source ID')
          .replace(/ColettiOS/g, 'Coletti & Co.');
        if (next !== current) node.nodeValue = next;
      }
    };
    window.addEventListener('DOMContentLoaded', () => {
      sanitizeClientBranding();
      new MutationObserver(sanitizeClientBranding).observe(document.body, {childList:true, subtree:true, characterData:true});
    });
  </script>
</head>
<body class="operational-portal" data-portal="client">
  <a class="skip-link" href="#main">Skip to workspace</a>
  <header id="site-header"></header>
  <div id="app-banner"></div>
  <main id="main" tabindex="-1"><div class="loading">Loading secure client workspace…</div></main>
  <footer id="site-footer"></footer>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/assets/portal_routing_v1.js"></script>
  <script type="module" src="/assets/app.js"></script>
  <script type="module" src="/assets/portal_integration_v2.js"></script>
</body>
</html>
